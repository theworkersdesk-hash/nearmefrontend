name: vibe
description: Vibe — location-based social app (Flutter client).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Networking
  dio: ^5.6.0

  # Real-time
  socket_io_client: ^2.0.3+1

  # Firebase
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  firebase_messaging: ^15.1.0
  firebase_storage: ^12.2.0
  google_sign_in: ^6.2.1

  # Location
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Media
  image_picker: ^1.1.2
  image_cropper: ^7.1.0
  cached_network_image: ^3.4.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  hive: ^2.2.3            # local NoSQL DB (offline cache for feed/events/chat)
  hive_flutter: ^1.1.0   # Flutter bindings + initFlutter

  # UI / UX
  intl: ^0.19.0
  flutter_svg: ^2.0.10   # render the vector logo / accent marks
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.1
  pinput: ^5.0.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/onboarding_hero.png
    - assets/images/logo_mark.svg
    - assets/images/connection.svg
    - assets/images/
    - assets/icons/
